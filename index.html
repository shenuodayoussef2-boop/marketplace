<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - متجر متعدد البائعين</title>
    <!-- مكتبة Tailwind CSS للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Supabase للربط بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- الهيدر الرئيسي -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🛒 Marketplace</h1>
            <div id="nav-auth" class="flex gap-2 items-center">
                <button onclick="showModal('login-modal')" class="bg-indigo-700 px-4 py-2 rounded hover:bg-indigo-800">تسجيل الدخول</button>
                <button onclick="showModal('register-modal')" class="bg-white text-indigo-600 px-4 py-2 rounded font-semibold hover:bg-gray-100">حساب جديد</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-8">
        <!-- ترحيب وتنبيهات -->
        <div id="alert-box" class="mb-4 hidden p-4 rounded text-white text-center"></div>

        <!-- قسم عرض المنتجات المعتمدة للعملاء -->
        <section id="customer-section">
            <h2 class="text-xl font-bold mb-4">🛍️ المنتجات المتاحة</h2>
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- المنتجات هتتحمل هنا ديناميكياً -->
                <p class="text-gray-500">جاري تحميل المنتجات...</p>
            </div>
        </section>

        <!-- لوحة تحكم التاجر -->
        <section id="merchant-section" class="hidden mt-8 bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4 text-indigo-600">🏪 لوحة تحكم التاجر</h2>
            <div class="mb-6 p-4 border rounded bg-gray-50">
                <h3 class="font-bold mb-2">إضافة منتج جديد (في انتظار الموافقة)</h3>
                <input type="text" id="p-title" placeholder="اسم المنتج" class="w-full p-2 mb-2 border rounded">
                <input type="number" id="p-price" placeholder="السعر" class="w-full p-2 mb-2 border rounded">
                <input type="text" id="p-category" placeholder="التصنيف (موبايلات، لابتوبات..)" class="w-full p-2 mb-2 border rounded">
                <input type="text" id="p-image" placeholder="رابط صورة المنتج" class="w-full p-2 mb-2 border rounded">
                <button onclick="addMerchantProduct()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">إضافة المنتج</button>
            </div>
        </section>

        <!-- لوحة تحكم الأدمن -->
        <section id="admin-section" class="hidden mt-8 bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4 text-red-600">🛡️ لوحة تحكم الأدمن (مراجعة المنتجات)</h2>
            <div id="pending-products-list" class="space-y-4">
                <!-- المنتجات المعلقة تظهر هنا -->
            </div>
        </section>
    </main>

    <!-- مودال تسجيل الدخول -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-96 shadow-lg">
            <h3 class="text-xl font-bold mb-4">تسجيل الدخول</h3>
            <input type="email" id="login-email" placeholder="البريد الإلكتروني" class="w-full p-2 mb-3 border rounded">
            <input type="password" id="login-password" placeholder="كلمة المرور" class="w-full p-2 mb-4 border rounded">
            <div class="flex justify-between">
                <button onclick="loginUser()" class="bg-indigo-600 text-white px-4 py-2 rounded">دخول</button>
                <button onclick="hideModal('login-modal')" class="text-gray-500">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- مودال إنشاء حساب -->
    <div id="register-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-96 shadow-lg">
            <h3 class="text-xl font-bold mb-4">إنشاء حساب جديد</h3>
            <input type="text" id="reg-name" placeholder="الاسم الكامل" class="w-full p-2 mb-3 border rounded">
            <input type="email" id="reg-email" placeholder="البريد الإلكتروني" class="w-full p-2 mb-3 border rounded">
            <input type="password" id="reg-password" placeholder="كلمة المرور" class="w-full p-2 mb-3 border rounded">
            <select id="reg-role" class="w-full p-2 mb-4 border rounded">
                <option value="customer">عميل</option>
                <option value="merchant">تاجر</option>
                <option value="admin">أدمن</option>
            </select>
            <div class="flex justify-between">
                <button onclick="registerUser()" class="bg-indigo-600 text-white px-4 py-2 rounded">تسجيل</button>
                <button onclick="hideModal('register-modal')" class="text-gray-500">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- كود JavaScript للتشغيل -->
    <script>
        // إعدادات الاتصال بـ Supabase
        const SUPABASE_URL = 'https://miqqwdxfqklkweqlvffg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gd_SrlvmZSTi-96gH7MzIg_4iE9CzTx';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(localStorage.getItem('marketplace_user')) || null;

        window.onload = function() {
            checkAuthUI();
            loadProducts();
            if(currentUser && currentUser.role === 'admin') {
                loadPendingProducts();
            }
        };

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

        function showAlert(msg, type = 'success') {
            const box = document.getElementById('alert-box');
            box.innerText = msg;
            box.className = `mb-4 p-4 rounded text-white text-center ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        // تسجيل مستخدم جديد
        async function registerUser() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            const { data, error } = await supabase.from('users').insert([{ name, email, password, role }]).select();
            if (error) {
                showAlert('خطأ في التسجيل: ' + error.message, 'error');
            } else {
                showAlert('تم إنشاء الحساب بنجاح! سجل دخولك الآن.');
                hideModal('register-modal');
            }
        }

        // تسجيل الدخول
        async function loginUser() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.from('users').select('*').eq('email', email).eq('password', password).single();
            if (error || !data) {
                showAlert('البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
            } else {
                currentUser = data;
                localStorage.setItem('marketplace_user', JSON.stringify(currentUser));
                showAlert(`مرحباً بك يا ${data.name}`);
                hideModal('login-modal');
                checkAuthUI();
                location.reload();
            }
        }

        function logout() {
            localStorage.removeItem('marketplace_user');
            location.reload();
        }

        function checkAuthUI() {
            const navAuth = document.getElementById('nav-auth');
            if (currentUser) {
                navAuth.innerHTML = `
                    <span class="font-semibold">مرحباً، ${currentUser.name} (${currentUser.role})</span>
                    <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded text-sm">خروج</button>
                `;
                if (currentUser.role === 'merchant') {
                    document.getElementById('merchant-section').classList.remove('hidden');
                }
                if (currentUser.role === 'admin') {
                    document.getElementById('admin-section').classList.remove('hidden');
                }
            }
        }

        // تحميل المنتجات المعتمدة للعملاء
        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            const { data, error } = await supabase.from('products').select('*').eq('status', 'approved').eq('is_hidden', false);
            
            if (error || !data || data.length === 0) {
                grid.innerHTML = '<p class="text-gray-500">لا توجد منتجات متاح حالياً.</p>';
                return;
            }

            grid.innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-lg shadow border">
                    <img src="${p.image_url || 'https://via.placeholder.com/300'}" class="w-full h-48 object-cover rounded mb-2">
                    <h3 class="font-bold text-lg">${p.title}</h3>
                    <p class="text-indigo-600 font-bold mt-1">${p.price} جنيه</p>
                    <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded mt-2 inline-block">${p.category}</span>
                </div>
            `).join('');
        }

        // إضافة منتج من قبل التاجر (بحالة pending)
        async function addMerchantProduct() {
            if (!currentUser || currentUser.role !== 'merchant') return;

            const title = document.getElementById('p-title').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const category = document.getElementById('p-category').value;
            const image_url = document.getElementById('p-image').value;

            const { error } = await supabase.from('products').insert([{
                merchant_id: currentUser.id,
                title, price, category, image_url,
                status: 'pending'
            }]);

            if (error) {
                showAlert('خطأ أثناء إضافة المنتج', 'error');
            } else {
                showAlert('تم إرسال المنتج للأدمن في انتظار الموافقة! ✅');
                document.getElementById('p-title').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-category').value = '';
                document.getElementById('p-image').value = '';
            }
        }

        // تحميل المنتجات المعلقة للأدمن للموافقة عليها
        async function loadPendingProducts() {
            const list = document.getElementById('pending-products-list');
            const { data, error } = await supabase.from('products').select('*').eq('status', 'pending');

            if (error || !data || data.length === 0) {
                list.innerHTML = '<p class="text-gray-500">لا توجد منتجات معلقة للمراجعة.</p>';
                return;
            }

            list.innerHTML = data.map(p => `
                <div class="flex justify-between items-center p-3 border rounded bg-gray-50">
                    <div>
                        <h4 class="font-bold">${p.title} - ${p.price} جنيه</h4>
                        <p class="text-sm text-gray-500">التصنيف: ${p.category}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="updateProductStatus('${p.id}', 'approved')" class="bg-green-500 text-white px-3 py-1 rounded text-sm">موافقة ونشر</button>
                        <button onclick="updateProductStatus('${p.id}', 'rejected')" class="bg-red-500 text-white px-3 py-1 rounded text-sm">رفض</button>
                    </div>
                </div>
            `).join('');
        }

        // تغيير حالة المنتج بواسطة الأدمن
        async function updateProductStatus(id, status) {
            const { error } = await supabase.from('products').update({ status }).eq('id', id);
            if (error) {
                showAlert('حدث خطأ', 'error');
            } else {
                showAlert(`تم تحديث حالة المنتج إلى: ${status}`);
                loadPendingProducts();
            }
        }
    </script>
</body>
</html>
