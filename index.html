<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- الهيدر -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-black">🛒 Marketplace</h1>
            <div id="nav-auth" class="flex gap-2 items-center">
                <button onclick="showModal('login-modal')" class="bg-indigo-700 px-3 py-1.5 rounded-xl text-xs font-bold">دخول</button>
                <button onclick="showModal('register-modal')" class="bg-white text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-bold">حساب جديد</button>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <main class="container mx-auto px-4 py-6 space-y-6">
        <div id="alert-box" class="hidden p-3 rounded-xl text-white text-center shadow font-bold text-xs"></div>

        <!-- قسم عرض المنتجات -->
        <section id="customer-section" class="space-y-4">
            <h2 class="text-lg font-black text-gray-800">🛍️ المنتجات المتاحة</h2>
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div class="col-span-full text-center py-12 text-gray-400">
                    <p class="font-bold text-xs">جاري تحميل المنتجات...</p>
                </div>
            </div>
        </section>

        <!-- لوحة التحكم للتاجر والأدمن -->
        <section id="dashboard-section" class="hidden space-y-6 bg-white p-6 rounded-2xl shadow-sm border">
            <div class="flex justify-between items-center border-b pb-4">
                <h2 id="dash-title" class="text-xl font-black text-indigo-600">لوحة التحكم</h2>
                <button onclick="location.reload()" class="bg-gray-100 px-3 py-1.5 rounded-xl text-xs font-bold">إغلاق</button>
            </div>

            <!-- نموذج إضافة منتج (للتاجر) -->
            <div id="merchant-add-box" class="hidden p-4 border rounded-xl bg-gray-50 space-y-3">
                <h3 class="font-black text-sm">➕ إضافة منتج جديد</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="p-title" placeholder="اسم المنتج" class="p-3 border rounded-xl bg-white text-xs">
                    <input type="number" id="p-price" placeholder="السعر" class="p-3 border rounded-xl bg-white text-xs">
                    <input type="text" id="p-category" placeholder="التصنيف" class="p-3 border rounded-xl bg-white text-xs">
                    <input type="text" id="p-image" placeholder="رابط الصورة (URL)" class="p-3 border rounded-xl bg-white text-xs">
                </div>
                <button onclick="addProduct()" class="bg-indigo-600 text-white px-5 py-2 rounded-xl font-bold text-xs">نشر المنتج</button>
            </div>

            <!-- طلبات المنتجات للأدمن أو منتجات التاجر -->
            <div>
                <h3 id="list-title" class="font-black text-sm mb-3">القائمة</h3>
                <div id="dashboard-list" class="space-y-2"></div>
            </div>
        </section>
    </main>

    <!-- مودال تسجيل الدخول -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="font-black text-base">تسجيل الدخول</h3>
            <input type="email" id="login-email" placeholder="البريد الإلكتروني" class="w-full p-3 border rounded-xl text-xs">
            <input type="password" id="login-password" placeholder="كلمة المرور" class="w-full p-3 border rounded-xl text-xs">
            <div class="flex justify-end gap-2">
                <button onclick="hideModal('login-modal')" class="px-3 py-2 text-xs text-gray-500">إلغاء</button>
                <button onclick="loginUser()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">دخول</button>
            </div>
        </div>
    </div>

    <!-- مودال إنشاء حساب -->
    <div id="register-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="font-black text-base">حساب جديد</h3>
            <input type="text" id="reg-name" placeholder="الاسم" class="w-full p-3 border rounded-xl text-xs">
            <input type="email" id="reg-email" placeholder="البريد الإلكتروني" class="w-full p-3 border rounded-xl text-xs">
            <input type="password" id="reg-password" placeholder="كلمة المرور" class="w-full p-3 border rounded-xl text-xs">
            <select id="reg-role" class="w-full p-3 border rounded-xl text-xs font-bold bg-white">
                <option value="customer">عميل</option>
                <option value="merchant">تاجر</option>
                <option value="admin">أدمن</option>
            </select>
            <div class="flex justify-end gap-2">
                <button onclick="hideModal('register-modal')" class="px-3 py-2 text-xs text-gray-500">إلغاء</button>
                <button onclick="registerUser()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">تسجيل</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://miqqwdxfqklkweqlvffg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gd_SrlvmZSTi-96gH7MzIg_4iE9CzTx';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(localStorage.getItem('marketplace_user')) || null;

        window.onload = function() {
            checkAuth();
            loadProducts();
        };

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

        function showAlert(msg, type = 'success') {
            const box = document.getElementById('alert-box');
            box.innerText = msg;
            box.className = `p-3 rounded-xl text-white text-center shadow font-bold text-xs ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        async function registerUser() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            const { error } = await supabase.from('users').insert([{ name, email, password, role }]);
            if (error) showAlert('خطأ: ' + error.message, 'error');
            else { showAlert('تم التسجيل بنجاح!'); hideModal('register-modal'); }
        }

        async function loginUser() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.from('users').select('*').eq('email', email).eq('password', password).single();
            if (error || !data) showAlert('بيانات الدخول غير صحيحة', 'error');
            else {
                currentUser = data;
                localStorage.setItem('marketplace_user', JSON.stringify(currentUser));
                location.reload();
            }
        }

        function checkAuth() {
            if (!currentUser) return;
            const nav = document.getElementById('nav-auth');
            nav.innerHTML = `
                <span class="text-xs font-bold">${currentUser.name}</span>
                <button onclick="openDashboard()" class="bg-indigo-800 px-3 py-1.5 rounded-xl text-xs font-bold">لوحة التحكم</button>
                <button onclick="localStorage.removeItem('marketplace_user'); location.reload();" class="bg-rose-500 px-3 py-1.5 rounded-xl text-xs font-bold">خروج</button>
            `;
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            const { data } = await supabase.from('products').select('*');
            if (!data || data.length === 0) {
                grid.innerHTML = '<p class="text-gray-400 col-span-full text-center py-12 text-xs font-bold">لا توجد منتجات.</p>';
                return;
            }
            grid.innerHTML = data.map(p => `
                <div class="bg-white p-3 rounded-2xl shadow-sm border">
                    <img src="${p.image_url || 'https://via.placeholder.com/300'}" class="w-full h-36 object-cover rounded-xl mb-2">
                    <h3 class="font-bold text-sm mb-1">${p.title}</h3>
                    <p class="text-indigo-600 font-black">${p.price} جنيه</p>
                </div>
            `).join('');
        }

        async function openDashboard() {
            document.getElementById('customer-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            if (currentUser.role === 'merchant') {
                document.getElementById('dash-title').innerText = 'لوحة تحكم التاجر';
                document.getElementById('merchant-add-box').classList.remove('hidden');
                document.getElementById('list-title').innerText = 'منتجاتك';
                
                const { data } = await supabase.from('products').select('*').eq('merchant_id', currentUser.id);
                document.getElementById('dashboard-list').innerHTML = data?.map(p => `<div class="p-2 border rounded text-xs font-bold">${p.title} - ${p.price} جنيه</div>`).join('') || 'لا توجد منتجات';
            
            } else if (currentUser.role === 'admin') {
                document.getElementById('dash-title').innerText = 'لوحة تحكم الأدمن';
                document.getElementById('list-title').innerText = 'كل المنتجات';
                
                const { data } = await supabase.from('products').select('*');
                document.getElementById('dashboard-list').innerHTML = data?.map(p => `
                    <div class="p-2 border rounded flex justify-between items-center text-xs">
                        <span>${p.title} (${p.price} ج)</span>
                        <button onclick="deleteProduct('${p.id}')" class="bg-rose-500 text-white px-2 py-1 rounded">حذف</button>
                    </div>
                `).join('') || 'لا توجد منتجات';
            }
        }

        async function addProduct() {
            const title = document.getElementById('p-title').value;
            const price = document.getElementById('p-price').value;
            const category = document.getElementById('p-category').value;
            const image_url = document.getElementById('p-image').value;

            await supabase.from('products').insert([{ title, price, category, image_url, merchant_id: currentUser.id }]);
            showAlert('تم الإضافة بنجاح');
            openDashboard();
        }

        async function deleteProduct(id) {
            await supabase.from('products').delete().eq('id', id);
            showAlert('تم الحذف');
            openDashboard();
        }
    </script>
</body>
</html>
